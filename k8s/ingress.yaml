apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasktracker-ingress
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tasktracker-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tasktracker-web
                port:
                  number: 80
