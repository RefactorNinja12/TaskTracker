server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM-filer ska serveras med rätt MIME-typ
    location ~ \.wasm$ {
        default_type application/wasm;
    }

    # Blazor routar klientsidan själv (via JS) - all okänd sökväg
    # ska falla tillbaka till index.html, annars 404:ar nginx
    # direktnavigering till t.ex. /task/5
    location / {
        try_files $uri $uri/ /index.html;
    }
}
